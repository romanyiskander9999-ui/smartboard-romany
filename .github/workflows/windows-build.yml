name: SchoolVerse SuperBoard Windows Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "advanced-tools.js"
      - "electron/**"
      - "package.json"
      - "qa/**"
      - ".github/workflows/windows-build.yml"
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run smoke checks
        run: npm run test:smoke
      - name: Build NSIS installer and portable app
        run: npm run dist:win
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: SchoolVerse-SuperBoard-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14
